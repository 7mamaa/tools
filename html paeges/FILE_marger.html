<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة دمج الملفات النصية المتقدمة</title>
    <!-- مكتبة قراءة ملفات docx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- مكتبة JSZip لقراءة ملفات ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f7fa;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .drop-zone {
            border: 3px dashed #3498db;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
        }
        .drop-zone:hover, .drop-zone.dragover {
            background: #eaf2f8;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0 20px;
        }
        .file-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            padding: 6px 12px;
            margin: 2px 0;
            border-bottom: 1px solid #eee;
        }
        .file-item .name {
            font-weight: bold;
            margin-right: 10px;
            word-break: break-all;
        }
        .file-item .size {
            color: #6c757d;
            font-size: 0.85em;
            margin-right: 10px;
        }
        .file-item button {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .file-item button:hover {
            background: #c0392b;
        }
        .separator-input {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .separator-input input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: opacity 0.2s;
        }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-info { background: #9b59b6; color: white; }
        .btn:hover { opacity: 0.85; }
        textarea {
            width: 100%;
            height: 350px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
        }
        .download-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 أداة دمج الملفات النصية المتقدمة</h1>
        
        <div class="drop-zone" id="dropZone">
            <p>اسحب الملفات أو المجلدات أو ملفات ZIP هنا</p>
            <p style="font-size:0.9em;color:#666;">أو استخدم الأزرار بالأسفل</p>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="btnFiles">📁 اختيار ملفات</button>
            <button class="btn btn-primary" id="btnFolder">📂 اختيار مجلد كامل</button>
            <input type="file" id="fileInput" multiple accept=".txt,.md,.sql,.docx,.json,.csv,.log,.xml,.html,.css,.js,.py,.java,.c,.cpp,.zip" style="display:none;">
            <input type="file" id="folderInput" webkitdirectory multiple style="display:none;">
        </div>

        <ul class="file-list" id="fileList"></ul>

        <div class="separator-input">
            <label>الفاصل بين الملفات:</label>
            <input type="text" id="separator" value="\n\n==========\n\n" placeholder="مثال: \n\n---\n\n">
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="mergeBtn">🧩 دمج الملفات</button>
            <button class="btn btn-success" id="copyBtn">📋 نسخ الناتج</button>
            <button class="btn btn-warning" id="clearBtn">🗑️ مسح الكل</button>
        </div>

        <textarea id="output" placeholder="الناتج سيظهر هنا..."></textarea>

        <div class="download-options">
            <span>تنزيل كـ:</span>
            <button class="btn btn-info" data-ext="txt">TXT</button>
            <button class="btn btn-info" data-ext="md">MD</button>
            <button class="btn btn-info" data-ext="sql">SQL</button>
            <button class="btn btn-info" data-ext="html">HTML</button>
            <button class="btn btn-info" data-ext="doc">DOC (Word)</button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const btnFiles = document.getElementById('btnFiles');
        const btnFolder = document.getElementById('btnFolder');
        const fileList = document.getElementById('fileList');
        const output = document.getElementById('output');
        const separatorInput = document.getElementById('separator');
        const mergeBtn = document.getElementById('mergeBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadButtons = document.querySelectorAll('[data-ext]');

        // مصفوفة الملفات: كل عنصر { name: string, file: File, size: number }
        let files = [];

        // ========== الأحداث ==========
        dropZone.addEventListener('click', () => fileInput.click());
        btnFiles.addEventListener('click', () => fileInput.click());
        btnFolder.addEventListener('click', () => folderInput.click());

        // منع السلوك الافتراضي للسحب
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // معالجة السحب والإفلات (ملفات + مجلدات + ZIP)
        dropZone.addEventListener('drop', async (e) => {
            const items = e.dataTransfer.items;
            if (items) {
                // استخدام واجهة المسارات للتعامل مع المجلدات
                for (let i = 0; i < items.length; i++) {
                    const item = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                    if (item) {
                        await processEntry(item, '');
                    } else {
                        // fallback: معالجة كملفات عادية
                        const droppedFiles = e.dataTransfer.files;
                        if (droppedFiles.length) {
                            await addFilesFromFileList(droppedFiles);
                        }
                    }
                }
            } else {
                const droppedFiles = e.dataTransfer.files;
                if (droppedFiles.length) {
                    await addFilesFromFileList(droppedFiles);
                }
            }
        });

        // عند اختيار ملفات عادية
        fileInput.addEventListener('change', async (e) => {
            if (e.target.files.length) {
                await addFilesFromFileList(e.target.files);
                fileInput.value = '';
            }
        });

        // عند اختيار مجلد كامل
        folderInput.addEventListener('change', async (e) => {
            if (e.target.files.length) {
                // الملفات تأتي مع webkitRelativePath
                const fileListArray = Array.from(e.target.files);
                for (let file of fileListArray) {
                    const relativePath = file.webkitRelativePath || file.name;
                    if (isTextFile(file.name)) {
                        files.push({
                            name: relativePath,
                            file: file,
                            size: file.size
                        });
                    }
                }
                renderFileList();
                folderInput.value = '';
            }
        });

        // ========== دوال معالجة المسارات والمجلدات ==========
        async function processEntry(entry, path) {
            if (entry.isFile) {
                const file = await new Promise((resolve, reject) => {
                    entry.file(resolve, reject);
                });
                const fullPath = path + file.name;
                if (isTextFile(file.name)) {
                    files.push({
                        name: fullPath,
                        file: file,
                        size: file.size
                    });
                } else if (file.name.toLowerCase().endsWith('.zip')) {
                    // معالجة ZIP داخل مجلد
                    await addZipFile(file, path);
                }
                renderFileList();
            } else if (entry.isDirectory) {
                const reader = entry.createReader();
                const entries = await new Promise((resolve, reject) => {
                    reader.readEntries(resolve, reject);
                });
                for (let childEntry of entries) {
                    await processEntry(childEntry, path + entry.name + '/');
                }
            }
        }

        async function addFilesFromFileList(fileListFromEvent) {
            for (let file of fileListFromEvent) {
                if (file.name.toLowerCase().endsWith('.zip')) {
                    await addZipFile(file, '');
                } else if (isTextFile(file.name)) {
                    files.push({
                        name: file.webkitRelativePath || file.name,
                        file: file,
                        size: file.size
                    });
                }
            }
            renderFileList();
        }

        // معالجة ملفات ZIP
        async function addZipFile(zipFile, basePath) {
            try {
                const arrayBuffer = await zipFile.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);
                const entries = Object.keys(zip.files);
                for (let entryName of entries) {
                    const zipEntry = zip.files[entryName];
                    if (zipEntry.dir) continue;
                    if (!isTextFile(entryName)) continue;
                    const content = await zipEntry.async('blob');
                    const file = new File([content], entryName.split('/').pop(), { type: 'text/plain' });
                    files.push({
                        name: basePath + entryName,
                        file: file,
                        size: file.size
                    });
                }
                renderFileList();
            } catch (err) {
                console.error('خطأ في قراءة ZIP:', err);
                alert('تعذر قراءة ملف ZIP: ' + zipFile.name);
            }
        }

        function isTextFile(filename) {
            const textExtensions = ['txt', 'md', 'sql', 'docx', 'json', 'csv', 'log', 'xml', 'html', 'css', 'js', 'py', 'java', 'c', 'cpp', 'yml', 'yaml', 'toml', 'ini', 'conf', 'sh', 'bat', 'ps1'];
            const ext = filename.split('.').pop().toLowerCase();
            return textExtensions.includes(ext);
        }

        function renderFileList() {
            fileList.innerHTML = '';
            // ترتيب الملفات أبجديًا حسب المسار
            files.sort((a, b) => a.name.localeCompare(b.name));
            files.forEach((entry, index) => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <span class="name">${entry.name}</span>
                    <span class="size">(${formatSize(entry.size)})</span>
                    <button onclick="removeFile(${index})">حذف</button>
                `;
                fileList.appendChild(li);
            });
        }

        function removeFile(index) {
            files.splice(index, 1);
            renderFileList();
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            else return (bytes / 1048576).toFixed(1) + ' MB';
        }

        // قراءة محتوى الملف
        async function readFileContent(entry) {
            const ext = entry.name.split('.').pop().toLowerCase();
            if (ext === 'docx') {
                try {
                    const arrayBuffer = await entry.file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    return result.value;
                } catch (err) {
                    console.error('خطأ في قراءة docx:', err);
                    return `[تعذر قراءة ${entry.name}]`;
                }
            } else {
                return await entry.file.text();
            }
        }

        // ========== الدمج ==========
        mergeBtn.addEventListener('click', async () => {
            if (files.length === 0) {
                alert('الرجاء إضافة ملفات أولاً.');
                return;
            }
            mergeBtn.textContent = '⏳ جاري الدمج...';
            mergeBtn.disabled = true;

            let combined = '';
            const separator = separatorInput.value.replace(/\\n/g, '\n');

            for (let i = 0; i < files.length; i++) {
                const content = await readFileContent(files[i]);
                // كتابة اسم الملف (المسار الكامل) في بداية المحتوى
                const header = `===== ${files[i].name} =====\n`;
                combined += header + content;
                if (i < files.length - 1) {
                    combined += separator;
                }
            }

            output.value = combined;
            mergeBtn.textContent = '🧩 دمج الملفات';
            mergeBtn.disabled = false;
        });

        // نسخ الناتج
        copyBtn.addEventListener('click', async () => {
            if (!output.value) {
                alert('لا يوجد نص لنسخه.');
                return;
            }
            try {
                await navigator.clipboard.writeText(output.value);
                alert('تم النسخ بنجاح ✅');
            } catch (err) {
                output.select();
                document.execCommand('copy');
                alert('تم النسخ (باستخدام الطريقة الاحتياطية).');
            }
        });

        // مسح الكل
        clearBtn.addEventListener('click', () => {
            files = [];
            renderFileList();
            output.value = '';
            separatorInput.value = '\\n\\n==========\\n\\n';
        });

        // التنزيل
        downloadButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!output.value) {
                    alert('لا يوجد محتوى للتنزيل.');
                    return;
                }
                const ext = btn.getAttribute('data-ext');
                downloadAs(output.value, ext);
            });
        });

        function downloadAs(content, ext) {
            let mimeType = 'text/plain';
            let fileName = 'merged.' + ext;
            let finalContent = content;

            switch (ext) {
                case 'txt':
                    mimeType = 'text/plain';
                    break;
                case 'md':
                    mimeType = 'text/markdown';
                    break;
                case 'sql':
                    mimeType = 'application/sql';
                    break;
                case 'html':
                    mimeType = 'text/html';
                    finalContent = `<pre>${escapeHtml(content)}</pre>`;
                    break;
                case 'doc':
                    mimeType = 'application/msword';
                    finalContent = `
                        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                        <head><meta charset='utf-8'></head>
                        <body><pre>${escapeHtml(content)}</pre></body>
                        </html>
                    `;
                    break;
                default:
                    break;
            }

            const blob = new Blob([finalContent], { type: mimeType + ';charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // إعادة تعيين الفاصل الافتراضي
        window.addEventListener('load', () => {
            separatorInput.value = '\\n\\n==========\\n\\n';
        });
    </script>
</body>
</html>
